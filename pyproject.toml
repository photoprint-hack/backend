[project]
name = "photoprint"
version = "1.2.0"
description = "FastAPI backend for the Photoprint hackathon project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30.0",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10,<3",
    "pwdlib[argon2]>=0.3,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit", "tests/api", "tests/integration"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C4", "RUF", "RET", "PIE"]
# Russian user-facing messages and docstrings intentionally use Cyrillic letters
# that Ruff flags as "ambiguous" against their Latin lookalikes.
ignore = ["RUF001", "RUF002", "RUF003"]
