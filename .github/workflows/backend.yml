name: Backend
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: photoprint_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-local-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d photoprint_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-local-only-password@localhost:5432/photoprint_test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked environment
        run: |
          python -m pip install uv==0.11.6
          uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check app scripts tests
          uv run ruff format --check app scripts tests
      - name: Unit tests
        run: uv run pytest -q tests/unit
      - name: API tests
        run: uv run pytest -q tests/api
      - name: Integration tests
        run: uv run pytest -q tests/integration
      - name: Check exported production contract
        run: |
          uv run python scripts/export_openapi.py --output /tmp/openapi.json
          cmp openapi.json /tmp/openapi.json
  container:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag photoprint-backend:ci .
      - name: Scan known fixable high and critical vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.1 image --scanners vuln --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 photoprint-backend:ci
